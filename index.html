<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Get Anchor</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f1410;
      --fg: #f4f1ea;
      --muted: #b7b2a6;
      --accent: #c4a35a;
      --card: #1a211c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
      background: radial-gradient(1200px 600px at 50% -10%, #243028 0%, var(--bg) 55%);
      color: var(--fg);
      display: grid;
      place-items: center;
      padding: 24px;
    }
    main {
      width: min(420px, 100%);
      background: color-mix(in srgb, var(--card) 92%, transparent);
      border: 1px solid color-mix(in srgb, var(--fg) 12%, transparent);
      border-radius: 20px;
      padding: 28px 24px;
      text-align: center;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.5rem;
      letter-spacing: -0.02em;
    }
    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.45;
      font-size: 0.98rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>Anchor</h1>
    <p id="msg">Detecting your device…</p>
  </main>
  <script>
(function () {
  var APP_STORE = "https://apps.apple.com/us/app/mindsight-anchor/id6758681004";
  // Optional: set after Play listing exists
  var PLAY_STORE = "";

  var ua = (navigator.userAgent || "").toLowerCase();
  var isAndroid = /android/.test(ua);
  var isIOS = /iphone|ipad|ipod/.test(ua) ||
    (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  var msg = document.getElementById("msg");

  if (isIOS) {
    msg.textContent = "Taking you to the App Store…";
    window.location.replace(APP_STORE);
    return;
  }

  if (isAndroid) {
    if (PLAY_STORE) {
      msg.textContent = "Taking you to Google Play…";
      window.location.replace(PLAY_STORE);
    } else {
      msg.textContent = "Anchor for Android is coming soon. Check back later.";
    }
    return;
  }

  // Desktop / unknown: auto-prefer App Store; no lock deep link on this page.
  msg.textContent = "Taking you to the App Store…";
  window.location.replace(APP_STORE);
})();
  </script>
</body>
</html>
