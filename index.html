<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Get Anchor</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f1410;
      --fg: #f4f1ea;
      --muted: #b7b2a6;
      --accent: #c4a35a;
      --card: #1a211c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
      background: radial-gradient(1200px 600px at 50% -10%, #243028 0%, var(--bg) 55%);
      color: var(--fg);
      display: grid;
      place-items: center;
      padding: 24px;
    }
    main {
      width: min(420px, 100%);
      background: color-mix(in srgb, var(--card) 92%, transparent);
      border: 1px solid color-mix(in srgb, var(--fg) 12%, transparent);
      border-radius: 20px;
      padding: 28px 24px;
      text-align: center;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.5rem;
      letter-spacing: -0.02em;
    }
    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.45;
      font-size: 0.98rem;
    }
    #stores {
      display: none;
      margin-top: 18px;
      flex-direction: column;
      gap: 10px;
    }
    #stores.show { display: flex; }
    #stores a {
      color: var(--fg);
      font-weight: 700;
      text-decoration: none;
      padding: 12px 14px;
      border-radius: 999px;
      border: 1px solid color-mix(in srgb, var(--fg) 18%, transparent);
    }
  </style>
</head>
<body>
  <main>
    <h1>Anchor</h1>
    <p id="msg">Detecting your device…</p>
    <div id="stores">
      <a id="app-store" href="https://apps.apple.com/us/app/mindsight-anchor/id6758681004">Download on the App Store</a>
      <a id="play-store" href="https://play.google.com/store/apps/details?id=com.mindsight.anchor">Get it on Google Play</a>
    </div>
  </main>
  <script>
(function () {
  var APP_STORE = "https://apps.apple.com/us/app/mindsight-anchor/id6758681004";
  var PLAY_STORE =
    "https://play.google.com/store/apps/details?id=com.mindsight.anchor";

  var ua = (navigator.userAgent || "").toLowerCase();
  var isAndroid = /android/.test(ua);
  var isIOS = /iphone|ipad|ipod/.test(ua) ||
    (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  var msg = document.getElementById("msg");
  var stores = document.getElementById("stores");
  var appLink = document.getElementById("app-store");
  var playLink = document.getElementById("play-store");

  function showStores(which) {
    if (which === "ios") playLink.hidden = true;
    if (which === "android") appLink.hidden = true;
    stores.classList.add("show");
  }

  if (isIOS) {
    msg.textContent = "Taking you to the App Store…";
    showStores("ios");
    window.location.replace(APP_STORE);
    return;
  }

  if (isAndroid) {
    msg.textContent = "Taking you to Google Play…";
    showStores("android");
    window.location.replace(PLAY_STORE);
    return;
  }

  msg.textContent = "Get Anchor on the App Store or Google Play.";
  showStores();
})();
  </script>
</body>
</html>
